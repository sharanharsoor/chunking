coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 1%
    patch:
      default:
        target: 70%
        threshold: 1%

comment:
  layout: "header,diff,files,footer"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

github_checks:
  annotations: true

ignore:
  - "tests/"
  - "examples/"
  - "benchmarks/"
  - "docs/"
  - "config_examples/"
  - "demo_results/"
  - "chunking_benchmarks/"
  - "*.pyc"
  - "__pycache__/"
  - "*.egg-info/"
  - "dist/"
  - "build/"
  - "htmlcov/"
  - "*.log"
